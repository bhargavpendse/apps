<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apps</title><meta name="description" content="Android apps: support and privacy pages."><style>
:root{--bg:#f6f8fb;--card:#fff;--text:#1b2733;--muted:#5b6b7b;--accent:#b26a00;--navy:#0d1b2a;--line:#e2e8f0}
@media (prefers-color-scheme:dark){:root{--bg:#0d1b2a;--card:#14263a;--text:#e8eef5;--muted:#9fb3c8;--accent:#ffd54f;--line:#24405e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
header{background:linear-gradient(135deg,#0d1b2a,#1b3a5c);color:#fff;padding:32px 16px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}header .wrap{display:flex;gap:16px;align-items:center;padding:0}
header img{width:64px;height:64px;border-radius:16px}header h1{margin:0;font-size:1.6rem}header p{margin:2px 0 0;color:#ffd54f}
main{padding:24px 16px 48px}h2{margin-top:2em;font-size:1.25rem}a{color:var(--accent)}
.lead{background:var(--card);border:1px solid var(--line);border-left:5px solid #ffb300;border-radius:12px;padding:16px 20px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}th{background:rgba(127,127,127,.08)}
.muted{color:var(--muted);font-size:.95rem}.app{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:inherit}
.app img{width:56px;height:56px;border-radius:14px}
</style></head>
<body>
<header><div class="wrap"><div><h1>Apps</h1><p>Support and privacy pages</p></div></div></header>
<main class="wrap">
<a class="app" href="sms-shield/privacy/"><img src="sms-shield/icon.png" alt=""><div><strong>SMS Shield</strong><br><span class="muted">Bank SMS alerts, scam warnings and spending insights — all on your phone. <u>Privacy policy</u></span></div></a>
<p class="muted">Contact: <a href="mailto:bhargavpendse.apps@gmail.com">bhargavpendse.apps@gmail.com</a></p>
</main></body></html>
